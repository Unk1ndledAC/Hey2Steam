name: Update Steam Game List

on:
  schedule:
    # Daily at 00:00 UTC. GitHub Actions cron uses UTC; adjust if you prefer a
    # different local time.
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Steam app list
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python scripts/update_game_list.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_games.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Steam app list ($(date -u +%Y-%m-%d))"
            git push
          fi
